name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Run Tests
        run: pnpm test

  # floating:
  #   name: "Floating Dependencies"
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 10

  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: pnpm/action-setup@v6
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 22
  #         cache: pnpm
  #     - name: Install Dependencies
  #       run: pnpm install --no-lockfile
  #     - name: Run Tests
  #       run: pnpm test

  try-scenarios:
    name: ${{ matrix.try-scenario }}
    runs-on: ubuntu-latest
    needs: 'test'
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        try-scenario:
          - ember-lts-4.12
          - ember-lts-5.4
          - ember-lts-5.12
          - ember-lts-6.4
          - ember-release
          - ember-beta
          - ember-canary
          - embroider-safe
          # - embroider-optimized

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Tests
        run: ./node_modules/.bin/ember try:one ${{ matrix.try-scenario }} --skip-cleanup
        working-directory: test-app

  publish:
    name: "Publish"
    runs-on: ubuntu-latest
    needs: 'test'
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    permissions:
      id-token: write # npm trusted publishing

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # Publishes only if the version in package.json isn't on the registry yet,
      # so pushes to main that don't bump the version are a no-op.
      - name: Publish
        run: pnpm publish -r
